name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package with provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install --global 'npm@^11.5.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify SDK dependency is published
        run: npm view @trovyhq/sdk@1.0.6 version

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Fresh install smoke test
        run: pnpm run smoke:pack

      - name: Publish to npm
        run: npm publish --access public

